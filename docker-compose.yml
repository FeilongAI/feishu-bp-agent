services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: feishu_bp_agent
      POSTGRES_USER: feishu_bp_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - feishu-bp-agent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feishu_bp_agent -d feishu_bp_agent"]
      interval: 5s
      timeout: 5s
      retries: 12
  feishu-bp-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: feishu-bp-agent:local
    container_name: feishu-bp-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8090
      DATABASE_URL: postgresql://feishu_bp_agent:${POSTGRES_PASSWORD}@postgres:5432/feishu_bp_agent
      REQUIRE_DATABASE_URL: "true"
      RUN_MIGRATIONS: "true"
      RUN_LARK_CONSUMER: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8090"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  feishu-bp-forwarder:
    build:
      context: .
      dockerfile: Dockerfile.forwarder
      args:
        LARK_CLI_VERSION: ${LARK_CLI_VERSION:-1.0.83}
    image: feishu-bp-forwarder:local
    container_name: feishu-bp-forwarder
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      FORWARDER_CORE_URL: http://feishu-bp-agent:8090
      FORWARDER_HEALTH_HOST: 0.0.0.0
      FORWARDER_HEALTH_PORT: 8091
      FORWARDER_SPOOL_DIR: /var/lib/feishu-bp-forwarder/spool
    depends_on:
      feishu-bp-agent:
        condition: service_healthy
    volumes:
      - feishu-bp-forwarder-state:/var/lib/feishu-bp-forwarder
      - feishu-bp-forwarder-cli-home:/home/app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  lark-mcp:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        LARK_MCP_VERSION: ${LARK_MCP_VERSION:-0.5.1}
    image: feishu-bp-lark-mcp:local
    container_name: feishu-bp-lark-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ID: ${FEISHU_APP_ID:-}
      APP_SECRET: ${FEISHU_APP_SECRET:-}
      LARK_DOMAIN: ${LARK_DOMAIN:-https://open.feishu.cn}
      LARK_TOKEN_MODE: ${LARK_TOKEN_MODE:-tenant_access_token}
      LARK_TOOLS: ${MCP_LARK_TOOLS:-bitable.v1.app.get,bitable.v1.appTable.list,bitable.v1.appTableField.list,bitable.v1.appTableField.delete,bitable.v1.appTableRecord.list,bitable.v1.appTableRecord.search,docx.v1.document.rawContent.get,im.v1.message.list,contact.v3.user.get}
    command: ["--mode", "streamable", "--host", "0.0.0.0", "--port", "3000", "--language", "zh", "--tool-name-case", "snake"]
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

volumes:
  feishu-bp-agent-postgres:
  feishu-bp-forwarder-state:
  feishu-bp-forwarder-cli-home:
