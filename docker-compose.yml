services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: feishu_bp_agent
      POSTGRES_USER: feishu_bp_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - feishu-bp-agent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feishu_bp_agent -d feishu_bp_agent"]
      interval: 5s
      timeout: 5s
      retries: 12
  feishu-bp-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: feishu-bp-agent:local
    container_name: feishu-bp-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8090
      DATABASE_URL: postgresql://feishu_bp_agent:${POSTGRES_PASSWORD}@postgres:5432/feishu_bp_agent
      REQUIRE_DATABASE_URL: "true"
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8090"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

volumes:
  feishu-bp-agent-postgres:
